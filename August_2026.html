lowing Path Of Rising Sun) — Started From Fiji → USA (East ToWest) ___________ ➢ Har Ghar Tiranga Campaign — Launched @ 2022"}, {"page": 28, "question": "Who Has Assumed Charge As The Acting Central Vigilance Commissioner (CVC)?", "options": {"A": "A.S. Rajeev", "B": "Praveen Kumar Srivastava", "C": "Sanjay Kumar Verma", "D": "Rajiv Gauba"}, "answer": "A", "explanation": "Succeeded — Praveen Kumar Srivastava __________ CVC Composition ▪ 1 Central Vigilance Commissioner — A.S. Rajeev ▪ + Up to 2 Vigilance Commissioners — Praveen Vashista"}, {"page": 30, "question": "ककस दे श िे 2026 िदहला FIH हॉकी ववश्व कप जीता? Which Country Won The 2026 Women’s FIH Hockey World Cup?", "options": {"A": "Netherlands", "B": "Argentina", "C": "Belgium", "D": "Australia"}, "answer": "B", "explanation": "Host countries : Belgium & Netherlands o Edition : 16th ➢ Champions : Argentina (3rd title) o Runner-up : Netherlands ▪ Top scorer : Yibbi Jansen — Netherlands (8 goals) ▪ Best player : Charlotte Englebert (Belgium) ▪ Best young player : Zoe Díaz (Argentina) ▪ Best goalkeeper : Jocelyn Bartram (Australia)"}, {"page": 31, "question": "ककस दे श िे 2026 पुरुष FIH हॉकी ववश्व कप जीता? Which Country Won The 2026 Men’s FIH Hockey World Cup?", "options": {"A": "Germany", "B": "Spain", "C": "Belgium", "D": "Netherlands"}, "answer": "A", "explanation": "Host countries : Belgium & Netherlands ➢ Champions : Germany (4th title) ➢ Runner-up : Spain ▪ IND’s Position — 8th ▪ Top scorer : Tomás Domene — Argentina (10 goals) ▪ Best player : Tomás Domene (Argentina) ▪ Best young player : Justus Warweg (Germany) ▪ Best goalkeeper : Luis Calzado (Spain)"}, {"page": 32, "question": "How Many Gallantry Awards Were Approved By President Droupadi Murmu On The Eve Of The Independence Day 2026?", "options": {"A": "78", "B": "50", "C": "62", "D": "75"}, "answer": "A", "explanation": "Gallantry Award on Peacetime (78) — To the personnel of the Defence Forces & CAPF ❑ Posthumous Gallantry Awards → 13 ➢ Kirti Chakra →
