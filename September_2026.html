let order=QUESTIONS.map((_,i)=>i),pos=0,answers={},started=Date.now(),reviewMode=false;
const $=id=>document.getElementById(id);$('totalPill').textContent='Questions: '+QUESTIONS.length;
function counts(){let vals=Object.values(answers);return {right:vals.filter(x=>x.correct).length,wrong:vals.filter(x=>!x.correct).length}}
function updateStats(){let c=counts();$('scorePill').textContent='Correct: '+c.right;$('wrongPill').textContent='Wrong: '+c.wrong}
function render(){let qi=order[pos],q=QUESTIONS[qi],done=answers[qi];$('counter').textContent=`Question ${pos+1} of ${order.length} • PDF page ${q.page}`;$('percent').textContent=Math.round(pos/order.length*100)+'% completed';$('bar').style.width=(pos/order.length*100)+'%';$('question').textContent=q.question;$('options').innerHTML='';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent='ABCD'[i]+'. '+o;b.onclick=()=>choose(i);if(done){b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===done.selected&&!done.correct)b.classList.add('wrong')}$('options').appendChild(b)});let f=$('feedback');f.className='feedback';f.innerHTML='';if(done){f.classList.add('show',done.correct?'good':'bad');f.innerHTML=`<b>${done.correct?'✓ Correct answer!':'✗ Wrong answer'}</b><div>Correct answer: <strong>${'ABCD'[q.answer]}. ${q.options[q.answer]}</strong></div><div class="explain"><strong>Explanation / notes from PDF:</strong><br>${escapeHtml(q.explanation)}</div>`}$('next').disabled=!done;$('next').textContent=pos===order.length-1?'View result →':'Next question →';$('finish').style.display=done&&pos<order.length-1?'inline-block':'none';updateStats()}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function choose(i){let qi=order[pos];if(answers[qi])return;answers[qi]={selected:i,correct:i===QUESTIONS[qi].answer};render()}
$('next').onclick=()=>{if(pos<order.length-1){pos++;render()}else showResult()};$('finish').onclick=showResult;
function showResult(){$('quiz').classList.add('hide');$('result').classList.remove('hide');let c=counts(),n=Object.keys(answers).length,p=Math.round(c.right/Math.max(1,n)*100);$('pct').textContent=p+'%';$('summary').textContent=`Attempted ${n} of ${order.length} questions in ${Math.floor((Date.now()-started)/60000)}m ${Math.floor(((Date.now()-started)%60000)/1000)}s.`;$('rightFinal').textContent='Correct: '+c.right;$('wrongFinal').textContent='Wrong: '+c.wrong;$('reviewBtn').disabled=c.wrong===0}
$('restart').onclick=()=>{answers={};pos=0;order=QUESTIONS.map((_,i)=>i);started=Date.now();$('result').classList.add('hide');$('quiz').classList.remove('hide');$('review').classList.add('hide');render()};
$('reviewBtn').onclick=()=>{let bad=order.filter(i=>answers[i]&&!answers[i].correct);$('review').classList.toggle('hide');$('review').innerHTML='<h3>Wrong answers ('+bad.length+')</h3>'+bad.map(i=>{let q=QUESTIONS[i];return `<div class="reviewitem"><b>PDF page ${q.page}: ${escapeHtml(q.question)}</b><p class="small">Your answer: ${'ABCD'[answers[i].selected]}. ${escapeHtml(q.options[answers[i].selected])}</p><p><b>Correct:</b> ${'ABCD'[q.answer]}. ${escapeHtml(q.options[q.answer])}</p><p class="small">${escapeHtml(q.explanation)}</p></div>`}).join('')};render();
