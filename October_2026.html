    <style>

        body {

            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: var(--primary);
            font-size: 2.25rem;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 30px;
            font-weight: 600;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }
        .question-number {
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            background: #ffffff;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 15px 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .option:hover:not(:disabled) {
            border-color: var(--primary);
            background: #eef2ff;
        }
        .option.selected {
            border-color: var(--primary);
            background: #eef2ff;
            color: var(--primary);
            font-weight: 600;
        }
        .option.correct {
            background: var(--success-bg) !important;
            border-color: var(--success) !important;
            color: #166534 !important;
            font-weight: 600;
        }
        .option.incorrect {
            background: var(--error-bg) !important;
            border-color: var(--error) !important;
            color: #991b1b !important;
        }
        .option:disabled {
            cursor: default;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        button.btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn:hover {
            background-color: var(--primary-hover);
        }
        button.btn:disabled {
            background-color: var(--border);
            cursor: not-allowed;
        }
        .results-card {
            text-align: center;
            padding: 50px 30px;
        }
        .score-circle {
            width: 120px;
            height: 120px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0 auto 25px auto;
            box-shadow: 0 10px 15px -3px rgb(79 70 229 / 0.4);
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const qNumberEl = document.getElementById('q-number');
        const qTextEl = document.getElementById('q-text');
        const optionsContainerEl = document.getElementById('options-container');
        const nextBtnEl = document.getElementById('next-btn');
        const progressIndicatorEl = document.getElementById('progress-indicator');
        const scoreIndicatorEl = document.getElementById('score-indicator');
        const quizContainerEl = document.getElementById('quiz-container');
        const resultsCardEl = document.getElementById('results-card');
        const finalScoreEl = document.getElementById('final-score');
        const resultMessageEl = document.getElementById('result-message');

        function loadQuestion() {
            answered = false;
            nextBtnEl.disabled = true;
            
            const q = quizData[currentQuestion];
            qNumberEl.innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
            qTextEl.innerText = q.question;
            progressIndicatorEl.innerText = `Question ${currentQuestion + 1} / ${quizData.length}`;

            optionsContainerEl.innerHTML = '';
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerText = option;
                btn.onclick = () => selectOption(btn, option, q.answer);
                optionsContainerEl.appendChild(btn);
            });
        }

        function selectOption(button, selectedOption, correctAnswer) {
            if (answered) return;
            answered = true;

            const buttons = optionsContainerEl.getElementsByClassName('option');
            for (let btn of buttons) {
                btn.disabled = true;
                if (btn.innerText === correctAnswer) {
                    btn.classList.add('correct');
                }
            }

            if (selectedOption === correctAnswer) {
                score++;
                scoreIndicatorEl.innerText = `Score: ${score}`;
            } else {
                button.classList.add('incorrect');
            }

            nextBtnEl.disabled = false;
            if (currentQuestion === quizData.length - 1) {
                nextBtnEl.innerText = 'View Results';
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizContainerEl.classList.add('hidden');
            resultsCardEl.classList.remove('hidden');
            finalScoreEl.innerText = `${score}/${quizData.length}`;
            
            const percentage = (score / quizData.length) * 100;
            let msg = '';
            if (percentage >= 90) {
                msg = 'Outstanding! You have a phenomenal grasp of current affairs!';
            } else if (percentage >= 75) {
                msg = 'Great job! Your preparation is strong and thorough.';
            } else if (percentage >= 50) {
                msg = 'Good effort! Review the material to sharpen your knowledge further.';
            } else {
                msg = 'Keep practicing! Review the monthly current affairs to boost your score.';
            }
            resultMessageEl.innerText = msg;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            scoreIndicatorEl.innerText = `Score: 0`;
            nextBtnEl.innerText = 'Next Question';
            resultsCardEl.classList.add('hidden');
            quizContainerEl.classList.remove('hidden');
            loadQuestion();
        }

        // Initialize Quiz
        loadQuestion();
    </script>
